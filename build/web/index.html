<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>The Last User</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas { border: 0; display: block; max-width: 100%; max-height: 100%; }
    #status { color: #aaa; margin: 10px 0; font-size: 14px; text-align: center; }
    #spinner { width: 30px; height: 30px; border: 4px solid #222; border-top: 4px solid #0f0; border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto; display: none; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #error { color: #ff5555; display: none; text-align: center; margin: 10px; font-family: monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="spinner"></div>
  <div id="status">Loading...</div>
  <div id="error"></div>
  <canvas id="canvas" width="900" height="480" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var statusEl = document.getElementById('status');
    var errorEl = document.getElementById('error');
    var spinnerEl = document.getElementById('spinner');
    var canvasEl = document.getElementById('canvas');

    function setStatus(text) {
      statusEl.textContent = text;
      if (text && text.indexOf('Error') === -1) {
        spinnerEl.style.display = 'block';
      } else {
        spinnerEl.style.display = 'none';
      }
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
      statusEl.style.display = 'none';
      spinnerEl.style.display = 'none';
      console.error(msg);
    }

    window.onerror = function(msg, url, line) {
      showError('Error: ' + msg + ' (' + url + ':' + line + ')');
      return true;
    };
    window.onunhandledrejection = function(e) {
      showError('Unhandled rejection: ' + (e.reason || e));
      return true;
    };

    var Module = {
      canvas: canvasEl,
      print: function() { console.log.apply(console, arguments); },
      printErr: function() { console.error.apply(console, arguments); },
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          setStatus('Loading assets... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        } else {
          setStatus('');
          spinnerEl.style.display = 'none';
        }
      },
      onAbort: function(what) {
        showError('Aborted: ' + what);
      },
      onUncaughtException: function(e) {
        showError('Exception: ' + (e && e.stack ? e.stack : String(e)));
      },
      onRuntimeInitialized: function() {
        setStatus('Ready');
        setTimeout(function() { statusEl.style.display = 'none'; }, 800);
      },
      locateFile: function(path) {
        return path;
      }
    };

    setStatus('Loading...');
  </script>
  <script async src="the-last-user.js"></script>
</body>
</html>
