<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>The Last User</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { font-family: arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    canvas.emscripten { border: 0; display: block; max-width: 100%; max-height: 100%; }
    #status { color: #aaa; margin: 8px 0; font-size: 14px; }
    #spinner { width: 30px; height: 30px; border: 4px solid #333; border-top: 4px solid #0f0; border-radius: 50%; animation: spin 1s linear infinite; display: none; margin: 8px 0; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="spinner"></div>
  <div id="status">Loading...</div>
  <canvas class="emscripten" id="canvas" width="900" height="480" oncontextmenu="event.preventDefault()"></canvas>

  <script>
    var statusEl = document.getElementById('status');
    var spinnerEl = document.getElementById('spinner');

    var setStatus = function(text) {
      statusEl.textContent = text;
      if (text && text !== 'Loading...') {
        spinnerEl.style.display = 'block';
      } else {
        spinnerEl.style.display = 'none';
      }
    };

    window.onerror = function(msg, url, line) {
      console.error('ERROR:', msg, url, line);
      setStatus('Error loading game. Check console (F12).');
      return true;
    };
    window.onunhandledrejection = function(e) {
      console.error('UNHANDLED REJECTION:', e.reason);
      setStatus('Error loading game. Check console (F12).');
      return true;
    };

    var Module = {
      print: function() { console.log.apply(console, arguments); },
      printErr: function() { console.error.apply(console, arguments); },
      canvas: document.getElementById('canvas'),
      setStatus: setStatus,
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          setStatus('Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        } else {
          setStatus('');
        }
      }
    };

    setStatus('Loading...');
  </script>
  <script async src="the-last-user.js"></script>
</body>
</html>
